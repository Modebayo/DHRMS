<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <title>Set New Password - Koladaisi University</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/mobile-responsive.css">
    <script src="https://unpkg.com/lucide@0.344.0"></script>

    <script src="../js/firebase-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/encryption.js"></script>
    <script src="../js/key-manager.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i data-lucide="key-round"></i>
                    </div>
                    <h1>Set New Password</h1>
                    <p class="subtitle" id="pageSubtitle">Create a new password for your account</p>
                </div>
            </div>

            <div id="alertBox"></div>

            <form id="resetForm" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 symbol" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordConfirm()">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="spinner" style="display:none;"></span>
                </button>
            </form>

            <div id="invalidState" style="display:none;">
                <div class="alert alert-error" id="invalidAlert"></div>
                <a href="login.html" class="btn btn-primary btn-full">Back to Login</a>
            </div>

            <div id="successState" style="display:none;">
                <div class="alert alert-success" id="successText"></div>
                <a href="login.html" class="btn btn-primary btn-full">Go to Login</a>
            </div>

            <div class="auth-footer">
                <p><a href="login.html">&larr; Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordConfirm() {
            const input = document.getElementById('confirmPassword');
            const icon = input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                if (icon) icon.setAttribute('data-lucide', 'eye');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        async function recoverKeys(user, newPassword) {
            const doc = await db.collection('users').doc(user.uid).get();
            if (!doc.exists) return 'no_keys';

            const data = doc.data();
            if (!data.encryptedPrivateKey) return 'no_keys';

            if (data.keySecret) {
                try {
                    const privKeyJwk = await Encryption.decryptPrivateKey(data.encryptedPrivateKey, data.keySecret);
                    const encryptedPrivKey = await Encryption.encryptPrivateKey(privKeyJwk, newPassword);
                    await db.collection('users').doc(user.uid).update({ encryptedPrivateKey });
                    return 'reencrypted';
                } catch (e) {
                    console.warn('Could not unlock private key with stored keySecret:', e);
                }
            }

            const keyPair = await Encryption.generateKeyPair();
            const publicKey = await Encryption.exportPublicKey(keyPair.publicKey);
            const privKeyJwk = await Encryption.exportPrivateKey(keyPair.privateKey);
            const encryptedPrivKey = await Encryption.encryptPrivateKey(privKeyJwk, newPassword);

            await db.collection('users').doc(user.uid).update({
                publicKey,
                encryptedPrivateKey,
                keysVersion: (data.keysVersion || 1) + 1
            });

            return 'regenerated';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            initTheme();

            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            const oobCode = params.get('oobCode');

            const form = document.getElementById('resetForm');
            const invalidState = document.getElementById('invalidState');
            const successState = document.getElementById('successState');
            const btn = document.getElementById('resetBtn');
            const subtitle = document.getElementById('pageSubtitle');

            let resetEmail = null;

            function showInvalid(message) {
                document.getElementById('invalidAlert').textContent = message;
                invalidState.style.display = 'block';
            }

            if (!oobCode || mode !== 'resetPassword') {
                showInvalid('This reset link is invalid or incomplete. Please request a new one.');
                return;
            }

            try {
                resetEmail = await auth.verifyPasswordResetCode(oobCode);
            } catch (error) {
                console.error('Reset code verification error:', error);
                showInvalid('This reset link is invalid or has expired. Please request a new one.');
                return;
            }

            subtitle.textContent = `Create a new password for ${resetEmail}`;
            form.style.display = 'block';
            document.getElementById('password').focus();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!validatePassword(password)) {
                    showAlert('alertBox', 'Password must be at least 8 characters and include an uppercase letter, a number, and a symbol.', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('alertBox', 'Passwords do not match.', 'error');
                    return;
                }

                btn.disabled = true;
                btn.querySelector('.btn-text').style.display = 'none';
                btn.querySelector('.spinner').style.display = 'inline-block';

                try {
                    await auth.confirmPasswordReset(oobCode, password);

                    const userCredential = await auth.signInWithEmailAndPassword(resetEmail, password);
                    const user = userCredential.user;

                    let keysStatus = 'no_keys';
                    try {
                        keysStatus = await recoverKeys(user, password);
                    } catch (keyError) {
                        console.warn('Key recovery error:', keyError);
                    }

                    await auth.signOut();

                    form.style.display = 'none';
                    successState.style.display = 'block';
                    document.getElementById('successText').textContent = keysStatus === 'regenerated'
                        ? 'Your password has been reset. Because the previous password was not available, your secure encryption keys were regenerated — some older private messages may no longer be readable.'
                        : 'Your password has been reset successfully. You can now log in with your new password.';

                } catch (error) {
                    console.error('Password reset error:', error);

                    let message = 'Failed to reset your password. Please try again.';
                    if (error.code === 'auth/expired-action-code') message = 'This reset link has expired. Please request a new one.';
                    else if (error.code === 'auth/invalid-action-code') message = 'This reset link is no longer valid. Please request a new one.';
                    else if (error.code === 'auth/weak-password') message = 'Password is too weak. Use at least 8 characters with an uppercase letter, a number, and a symbol.';
                    else if (error.code === 'auth/too-many-requests') message = 'Too many attempts. Try again later.';

                    showAlert('alertBox', message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.querySelector('.btn-text').style.display = 'inline';
                    btn.querySelector('.spinner').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
